<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Embedded Office integration qualification</title>
<style>html,body{margin:0;height:100%;font:14px system-ui}header{height:42px;box-sizing:border-box;padding:10px 16px;background:#172c38;color:white}#editor{height:calc(100% - 42px)}iframe{width:100%;height:100%;border:0}#status{margin-left:20px;color:#bce8cf}</style>
<header>Integration qualification fixture <span id="status">Loading</span></header><main id="editor"></main>
<script type="module">
import {mountOfficeEditor} from '/office/sdk/index.mjs';
const apps=['wordcraft','pdfcraft','deckcraft','gridcraft'];
window.conformance={editor:null,events:[],saves:[],errors:[],ready:false,initialCapabilities:null,liveCapabilities:null};
window.conformance.load=async function(app){
  if(!apps.includes(app))throw Error('Unknown app');
  window.conformance.editor?.dispose();
  document.querySelector('#editor').replaceChildren();
  window.conformance.ready=false;
  const editor=mountOfficeEditor({container:document.querySelector('#editor'),app,assetBaseUrl:location.origin+'/office/apps',readyTimeoutMs:120000,host:{
    async writeFileAtomic({name,bytes,revision,saveAs}){
      const response=await fetch('/__qualification/save?app='+app+'&name='+encodeURIComponent(name),{method:'POST',body:bytes});
      if(!response.ok)throw Error('Qualification storage failed');
      const receipt=await response.json();window.conformance.saves.push({...receipt,revision,saveAs});return receipt;
    },
    onDirty(state){window.conformance.events.push({type:'dirty',...state});},
    onError(error){window.conformance.errors.push({code:error.code,message:error.message});}
  }});
  window.conformance.editor=editor;
  // ready may resolve with legacy support after the SDK's 100ms negotiation
  // window. Real Office-ready can follow a later egui frame; wait for its actual
  // declaration before admitting this durable-editor qualification fixture.
  window.conformance.initialCapabilities=await editor.ready;
  const timeoutMs=Number(new URLSearchParams(location.search).get('capabilityTimeoutMs')??90000);
  if(!Number.isInteger(timeoutMs)||timeoutMs<1||timeoutMs>90000)throw Error('Invalid capability deadline');
  const started=performance.now(),required=['office.open','office.commands','office.execute','office.inspect','office.export','office.save','office.close'];
  let caps;
  for(;;){
    caps=editor.capabilities();
    if(caps.ready&&caps.pageCommands&&caps.confirmedOpen&&caps.revisions&&caps.durableSave&&required.every(method=>caps.methods.includes(method)))break;
    if(editor.state().closed){const error=Error('Editor closed before live capabilities arrived');error.code='LIVE_EDITOR_DISPOSED';throw error;}
    if(performance.now()-started>=timeoutMs){const error=Error('Live Office capabilities did not arrive: '+JSON.stringify(caps));error.code='LIVE_CAPABILITIES_TIMEOUT';throw error;}
    await new Promise(resolve=>setTimeout(resolve,25));
  }
  window.conformance.liveCapabilities=caps;
  window.conformance.ready=true;
  document.querySelector('#status').textContent=app+' ready; '+(caps.pageCommands?'page commands':'legacy bridge');
  return caps;
};
try{await window.conformance.load(new URLSearchParams(location.search).get('app')||'wordcraft');}catch(error){window.conformance.errors.push({code:error.code,message:error.message});document.querySelector('#status').textContent=error.message;}
</script></html>
