name: Anonymous source3 reconstruction data readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Fetch every exact public reconstruction data asset without authentication
        timeout-minutes: 35
        run: node scripts/ci/verify-public-source3-data.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: anonymous-source3-reconstruction-data
          path: build/public-source3-data-ci/RESULT.json
          if-no-files-found: error
          retention-days: 14
