name: Exact public source3 WASM own-SDK qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: Install exact test-only Playwright and Chromium dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/office-web-browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/office-web-test" --no-package-lock --ignore-scripts playwright@1.64.0-alpha-1790635538000
          node "$RUNNER_TEMP/office-web-test/node_modules/playwright/cli.js" install chromium
      - name: Download exact public archive and exercise its own browser and Node SDKs
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/office-web-browsers
        timeout-minutes: 15
        run: node scripts/ci/web-source3-test/qualify-public.mjs --output-root build/web-source3-public-ci --playwright-module "$RUNNER_TEMP/office-web-test/node_modules/playwright/index.mjs"
      - name: Retain exact public archive identity and actual operation receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-wasm-source3-own-sdk-macos-15
          path: |
            build/web-source3-public-ci/**/PUBLIC-ARCHIVE.json
            build/web-source3-public-ci/**/RESULT.json
            build/web-source3-public-ci/**/browser.json
            build/web-source3-public-ci/**/node.json
            build/web-source3-public-ci/**/deck-guard.json
          if-no-files-found: error
          retention-days: 14
